    .slice(0, ROWS)
    .map(l => l.padEnd(COLS, " ").slice(0, COLS).split(""));
}

let baseGridOrig = buildGrid(ORIGINAL_ASCII);
let baseGrid = buildGrid(ORIGINAL_ASCII);

// Explosion particles store (vx, vy)
let particles = Array.from({ length: ROWS }, () =>
  Array.from({ length: COLS }, () => ({ vx: 0, vy: 0 }))
);

const baseEl = document.getElementById("base");
const matrixEl = document.getElementById("matrix");
const modeLabel = document.getElementById("modeLabel");

function renderBase() {
  baseEl.textContent = baseGrid.map(r => r.join("")).join("\n");
}
renderBase();

/* MATRIX GRID */
let matrixGrid = Array.from({ length: ROWS }, () => Array(COLS).fill(" "));

/* MATRIX COLUMNS */
const cols = Array.from({ length: COLS }, () => ({
  y: Math.random() * ROWS,
  speed: 0.4 + Math.random() * 0.8,
  length: 6 + Math.random() * 10
}));

/* MODES */
let mode = 1;
function setMode(m) {
  mode = m;
  modeLabel.textContent = `Mode: ${mode}`;
}

document.addEventListener("keydown", (e) => {
  const num = parseInt(e.key);
  if (num >= 1 && num <= 7) setMode(num);
});

/* RENDER MATRIX */
function renderMatrix() {
  let html = "";
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const ch = matrixGrid[y][x];
      if (ch === "@") html += `<span class="head">@</span>`;
      else if (ch === ".") html += `<span class="body">.</span>`;
      else html += " ";
    }
    html += "\n";
  }
  matrixEl.innerHTML = html;
}

/* MATRIX STEP */
function matrixStep() {
  matrixGrid.forEach(r => r.fill(" "));

  cols.forEach((c, x) => {
    c.y += c.speed;
    if (c.y > ROWS + c.length) c.y = -c.length;

    for (let i = 0; i < c.length; i++) {
      const y = (c.y | 0) - i;
      if (y < 0 || y >= ROWS) continue;

      if (baseGrid[y][x] !== " ") {
        matrixGrid[y][x] = i === 0 ? "@" : ".";
      }
    }
  });
}

/* SWAY */
let swayT = 0;
function swayBase() {
  swayT += 0.01;
  const sway = Math.sin(swayT) * 1;

  baseGrid = baseGridOrig.map(r => r.slice());

  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const ch = baseGridOrig[y][x];
      if (ch !== " ") {
        const nx = x + (Math.random() < 0.5 ? Math.floor(sway) : Math.ceil(sway));
        if (nx > 0 && nx < COLS && baseGrid[y][nx] === " ") {
          baseGrid[y][nx] = ch;
          baseGrid[y][x] = " ";
        }
      }
    }
  }
}

/* ACCENT BREATH */
let t = 0;
function updateAccent() {
  t += 0.015;
  document.documentElement.style.setProperty(
    "--accent-lightness",
    `${55 + Math.sin(t) * 8}%`
  );
}

/* EXPLOSION + SAND */
let sandEnabled = false;
let explosionActive = false;
const sandDelay = 30 * 1000; // 30 sec
const explosionDuration = 4000; // 4 sec
let explosionStart = 0;

function startSand() {
  sandEnabled = true;
  explosionActive = true;
  explosionStart = performance.now();

  // create explosion velocities
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (baseGridOrig[y][x] !== " ") {
        // random direction
        const angle = Math.random() * Math.PI * 2;
        const speed = 0.5 + Math.random() * 2.5;
        particles[y][x].vx = Math.cos(angle) * speed;
        particles[y][x].vy = Math.sin(angle) * speed - 1; // lift up a bit
      }
    }
  }
}

function explosionStep(delta) {
  // matrix off
  matrixEl.style.display = "none";

  const now = performance.now();
  const elapsed = now - explosionStart;

  // Explosion phase
  if (elapsed < explosionDuration) {
    let newGrid = Array.from({ length: ROWS }, () => Array(COLS).fill(" "));

    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        const ch = baseGridOrig[y][x];
        if (ch !== " ") {
          let nx = Math.round(x + particles[y][x].vx);
          let ny = Math.round(y + particles[y][x].vy);

          // keep inside
          nx = Math.max(0, Math.min(COLS - 1, nx));
          ny = Math.max(0, Math.min(ROWS - 1, ny));

          newGrid[ny][nx] = ch;

          // gravity effect
          particles[y][x].vy += 0.05;
        }
      }
    }

    baseGridOrig = newGrid;
  } else {
    // Explosion ended -> start normal sand fall
    explosionActive = false;
  }
}

function sandFallFull() {
  if (!sandEnabled) return;

  if (explosionActive) return; // wait for explosion to finish

  // normal sand collapse
  for (let y = ROWS - 2; y >= 0; y--) {
    for (let x = 0; x < COLS; x++) {
      const ch = baseGridOrig[y][x];
      if (ch !== " ") {
        if (baseGridOrig[y + 1][x] === " ") {
          baseGridOrig[y + 1][x] = ch;
          baseGridOrig[y][x] = " ";
        } else if (Math.random() < 0.3) {
          const dir = Math.random() < 0.5 ? -1 : 1;
          if (baseGridOrig[y + 1][x + dir] === " ") {
            baseGridOrig[y + 1][x + dir] = ch;
            baseGridOrig[y][x] = " ";
          }
        }
      }
    }
  }
}

// Start sand after 30 seconds
setTimeout(startSand, sandDelay);

/* LOOP */
let last = performance.now();
function loop() {
  const now = performance.now();
  const delta = now - last;
  last = now;

  updateAccent();
  swayBase();

  if (sandEnabled) {
    explosionStep(delta);
  }

  sandFallFull();
  renderBase();

  if (!sandEnabled) {
    matrixStep();
    renderMatrix();
  }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>

</body>
</html>
