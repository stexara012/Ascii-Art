<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Zen Matrix Bonsai</title>

<style>
:root {
  --accent-hue: 120;
  --accent-lightness: 60%;
}

body {
  margin: 0;
  background: #fdfefe;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

#container {
  position: relative;
}

.ascii {
  font-family: monospace;
  white-space: pre;
  line-height: 0.6;
  font-size: 4px;
}

/* 🌿 BASE – BONSAI */
#base {
  position: absolute;
  top: -450px;
  left: -430px;
  color: #0b2f1a;
  opacity: 0.35;
  text-shadow: 0 0 1px #0f4;
}

/* 🟢 MATRIX */
#matrix {
  position: absolute;
  top: -450px;
  left: -430px;
  pointer-events: none;
  mix-blend-mode: screen;
}

.head {
  color: hsl(var(--accent-hue), 80%, var(--accent-lightness));
  text-shadow: 0 0 6px currentColor;
}

.body {
  color: rgba(120, 255, 180, 0.35);
}

/* UI */
.label {
  position: fixed;
  left: 10px;
  top: 10px;
  font-family: monospace;
  color: #0a3;
  opacity: 0.6;
}
</style>
</head>

<body>

<div id="container">
  <div id="base" class="ascii"></div>
  <div id="matrix" class="ascii"></div>
</div>

<div class="label">Zen Matrix Bonsai</div>

`;

/* BUILD GRID */
function buildGrid(ascii) {
  return ascii
    .split("\n")
    .slice(0, ROWS)
    .map(l => l.padEnd(COLS, " ").slice(0, COLS).split(""));
}

const baseGrid = buildGrid(ORIGINAL_ASCII);

/* RENDER BASE */
const baseEl = document.getElementById("base");
baseEl.textContent = baseGrid.map(r => r.join("")).join("\n");

/* MATRIX GRID */
let matrixGrid = Array.from({ length: ROWS }, () => Array(COLS).fill(" "));
const matrixEl = document.getElementById("matrix");

/* MATRIX COLUMNS */
const cols = Array.from({ length: COLS }, () => ({
  y: Math.random() * ROWS,
  speed: 0.4 + Math.random() * 0.8,
  length: 6 + Math.random() * 10
}));

/* MATRIX STEP (BONSAI-AWARE) */
function matrixStep() {
  matrixGrid.forEach(r => r.fill(" "));

  cols.forEach((c, x) => {
    c.y += c.speed;
    if (c.y > ROWS + c.length) c.y = -c.length;

    for (let i = 0; i < c.length; i++) {
      const y = (c.y | 0) - i;
      if (
        y >= 0 &&
        y < ROWS &&
        baseGrid[y][x] !== " "
      ) {
        matrixGrid[y][x] = i === 0 ? "@" : ".";
      }
    }
  });
}

/* RENDER */
function render() {
  let html = "";
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const ch = matrixGrid[y][x];
      if (ch === "@")
        html += `<span class="head">@</span>`;
      else if (ch === ".")
        html += `<span class="body">.</span>`;
      else
        html += " ";
    }
    html += "\n";
  }
  matrixEl.innerHTML = html;
}

/* ACCENT BREATH (ZEN) */
let t = 0;
function updateAccent() {
  t += 0.015;
  document.documentElement.style.setProperty(
    "--accent-lightness",
    `${55 + Math.sin(t) * 8}%`
  );
}

/* LOOP */
function loop() {
  updateAccent();
  matrixStep();
  render();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
