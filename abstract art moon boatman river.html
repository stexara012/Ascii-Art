  <script>
   function colorAsciiArt(asciiText) {
  const colorMap = {
    '#': 'purple',      // jezgro sunca
    '*': 'narandzasta', // najjači sjaj
    '+': 'crvena',    // ekstremna toplota (UV 11+ efekat)
    '%': 'crna',     // blještavilo
    '=': 'krem',      // mekši prelaz
    '-': 'purple',
    '.': 'crvena',      // pozadina
    ':': 'purple',
    '@': 'crna' // može da simbolizuje UV (nevidljivo zračenje)
  };
  
      let coloredHtml = '';
      for (const char of asciiText) {
        if (colorMap[char]) {
          coloredHtml += `<span class="${colorMap[char]}">${char}</span>`;
        } else if (char === '\n') {
          coloredHtml += '<br>';
        } else {
          coloredHtml += char;
        }
      }
      return coloredHtml;
    }
