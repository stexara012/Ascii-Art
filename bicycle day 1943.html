<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ASCII Shape RGB Glitch</title>

<style>
body{
  margin:0;
  background:#050007;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family: monospace;
}

#container{
  position:relative;
  transform: scale(0.5);
}

.layer,
.rgbLayer{
  position:absolute;
  top:50%;
  left:50%;
  transform: translate(-50%, -50%);
  white-space: pre;
  line-height:0.6;
  font-size:8px;
  mix-blend-mode: screen;
  opacity:0.9;
  pointer-events:none;
}


.rgbLayer{
  mix-blend-mode: screen;
  opacity:0.9;
  pointer-events:none;
}

.r{ color:#ff0033; }
.g{ color:#00ff99; }
.b{ color:#3388ff; }


.glitchAnim{
  animation: glitchMove 0.07s infinite;
}

@keyframes glitchMove{
  0% { transform: translate(-50%, -50%) translate(0,0); }
  20% { transform: translate(-50%, -50%) translate(-3px,2px); }
  40% { transform: translate(-50%, -50%) translate(4px,-2px); }
  60% { transform: translate(-50%, -50%) translate(-5px,-3px); }
  80% { transform: translate(-50%, -50%) translate(3px,4px); }
  100% { transform: translate(-50%, -50%) translate(0,0); }
}

#ui{
  position:fixed;
  left:10px;
  top:10px;
  color:rgba(255,255,255,0.8);
  font-size:12px;
}
</style>
</head>

<body>

<div id="container">
  <pre id="rgbR" class="rgbLayer r"></pre>
  <pre id="rgbG" class="rgbLayer g"></pre>
  <pre id="rgbB" class="rgbLayer b"></pre>
</div>


<div id="ui">
  <div>1 = soft glitch</div>
  <div>2 = turbo glitch</div>
</div>

const colorMap = {
  "@":"#ff2bdc",
  "#":"#00ffff",
  "%":"#ffe600",
  "+":"#ff6b00",
  "-":"#8be9fd",
  "|":"#8be9fd",
  "*":"#ffffff",
  ".":"#50fa7b",
  ",":"#bd93f9"
};

/* =========================
   GRID BUILD
========================= */
function buildGrid(text){
  const lines = text
    .replace(/^\n/, "")
    .replace(/\n$/, "")
    .split("\n");

  return lines.map(l => l.split(""));
}

const asciiGrid = buildGrid(ASCII);
const h = asciiGrid.length;
const w = Math.max(...asciiGrid.map(r => r.length));

const baseGrid = Array.from({length:ROWS},()=>Array(COLS).fill(" "));
const startY = (ROWS/2 - h/2)|0;
const startX = (COLS/2 - w/2)|0;

for(let y=0;y<h;y++){
  for(let x=0;x<asciiGrid[y].length;x++){
    baseGrid[startY+y][startX+x] = asciiGrid[y][x];
  }
}

/* =========================
   GLITCH CHAR
========================= */
function randomChar(){
  const c = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*";
  return c[Math.floor(Math.random()*c.length)];
}

function glitchChars(grid, amount){
  const g = JSON.parse(JSON.stringify(grid));
  for(let i=0;i<amount;i++){
    const x = Math.random()*COLS|0;
    const y = Math.random()*ROWS|0;
    if(g[y][x] !== " ") g[y][x] = randomChar();
  }
  return g;
}

/* =========================
   SHAPE EXTRACTION
========================= */
function extractShapes(grid){
  const visited = Array.from({length:ROWS},()=>Array(COLS).fill(false));
  const shapes = [];

  for(let y=0;y<ROWS;y++){
    for(let x=0;x<COLS;x++){
      if(grid[y][x]===" " || visited[y][x]) continue;

      const stack=[{x,y}];
      const cells=[];
      visited[y][x]=true;

      while(stack.length){
        const p=stack.pop();
        cells.push({x:p.x,y:p.y,char:grid[p.y][p.x]});

        for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
          const nx=p.x+dx, ny=p.y+dy;
          if(nx>=0&&nx<COLS&&ny>=0&&ny<ROWS&&!visited[ny][nx]&&grid[ny][nx]!==" "){
            visited[ny][nx]=true;
            stack.push({x:nx,y:ny});
          }
        }
      }

      shapes.push({
        cells,
        vx:0,
        vy:0,
        age:0
      });
    }
  }
  return shapes;
}

/* =========================
   SHAPE GLITCH
========================= */
function glitchShapes(shapes,intensity){
  shapes.forEach(s=>{
    s.age++;
    if(Math.random()<intensity){
      s.vx+=(Math.random()-0.5)*4;
      s.vy+=(Math.random()-0.5)*4;
    }
    s.vx*=0.85;
    s.vy*=0.85;

    const dx=Math.round(s.vx);
    const dy=Math.round(s.vy);

    s.cells.forEach(c=>{
      c.x=Math.max(0,Math.min(COLS-1,c.x+dx));
      c.y=Math.max(0,Math.min(ROWS-1,c.y+dy));
    });
  });
  return shapes;
}

/* =========================
   RGB OFFSET
========================= */
const RGB_OFFSETS={
  r:{x:-2,y:1},
  g:{x:1,y:-1},
  b:{x:3,y:2}
};

function offsetShapes(shapes,off){
  return shapes.map(s=>({
    ...s,
    cells:s.cells.map(c=>({
      ...c,
      x:c.x+off.x,
      y:c.y+off.y
    }))
  }));
}

/* =========================
   RENDER
========================= */
function renderShapesText(el, shapes){
  const buffer = Array(ROWS * COLS).fill(" ");

  shapes.forEach(s => {
    s.cells.forEach(c => {
      if(
        c.x >= 0 && c.x < COLS &&
        c.y >= 0 && c.y < ROWS
      ){
        buffer[c.y * COLS + c.x] = c.char;
      }
    });
  });

  let out = "";
  for(let i = 0; i < buffer.length; i++){
    out += buffer[i];
    if((i + 1) % COLS === 0) out += "\n";
  }

  el.textContent = out;
}


/* =========================
   LOOP
========================= */
const rEl=document.getElementById("rgbR");
const gEl=document.getElementById("rgbG");
const bEl=document.getElementById("rgbB");

let mode=1;

function loop(){
  const g=glitchChars(baseGrid,mode===2?1400:600);
  let shapes=extractShapes(g);
  shapes=glitchShapes(shapes,mode===2?0.7:0.3);

  [rEl,gEl,bEl].forEach(el=>{
    el.classList.toggle("glitchAnim",mode===2);
  });

renderShapesText(rEl, offsetShapes(shapes, RGB_OFFSETS.r));
renderShapesText(gEl, offsetShapes(shapes, RGB_OFFSETS.g));
renderShapesText(bEl, offsetShapes(shapes, RGB_OFFSETS.b));

  requestAnimationFrame(loop);
}

document.addEventListener("keydown",e=>{
  if(e.key==="1") mode=1;
  if(e.key==="2") mode=2;
});

loop();
</script>
