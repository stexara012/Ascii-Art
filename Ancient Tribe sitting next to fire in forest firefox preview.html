  <title>Color map ASCII art</title>
  <style>
    body {
      background-color: hsla(308, 90%, 69%, 0.548);
      color: rgb(247, 240, 240);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      
      
      
      
    }
    
    .ascii-art {
      font-family: monospace;
      white-space: pre;
      line-height: 0.6;
      font-size:6px;
  scale: 0.65;
      

    }   

 .plava1 {
  color: #3399ff;
  text-shadow:
    0 0 5px #0066ff,
    0 0 15px #0066ff,
    0 0 30px #3399ff,
    0 0 60px #0066ff;
  animation: flickerBlue 2s infinite;
}

@keyframes flickerBlue {
  0%, 18%, 22%, 25%, 53%, 57%, 100% {
    opacity: 1;
  }
  20%, 24%, 55% {
    opacity: 0.4;
  }
}
    .plava2{
      color: rgb(3, 13, 71);
     
      
      
    }
    .plava3{
      color: rgb(10, 151, 233);
             text-shadow: 0 0 5px rgb(70, 4, 177)
      0 0 10px rgba(129, 1, 141, 0.986);
      
      
    }
  .crvena {
  color: #ff1a1a;
  text-shadow:
    0 0 5px #ff0000,
    0 0 15px #ff0000,
    0 0 30px #ff1a1a,
    0 0 60px #ff0000;
  animation: flicker 2s infinite;
}

@keyframes flicker {
  0%, 18%, 22%, 25%, 53%, 57%, 100% {
    opacity: 1;
  }
  20%, 24%, 55% {
    opacity: 0.4;
  }
}
    .narandzasta{

    }

    }

    }

      color: black;
      text-shadow: 0 0 5px rgb(70, 4, 177)

     .crvena {
  color: #ff4d4d;

}

.plava {
  color: #4da6ff;
  text-shadow: 0 0 3px #0066ff;
}
      
    }
    .pink{

    }  
    .purple{
      color: rgb(132, 0, 255);
       text-shadow: 0 0 5px rgb(70, 4, 177)
      0 0 10px rgba(129, 1, 141, 0.986);
    }
  
    @keyframes levitate {
  0%   { transform: translateY(0); }
  50%  { transform: translateY(0px); }
  100% { transform: translateY(0); }
}

.levitate {
  animation: levitate 3s ease-in-out infinite;
}

<body>
  
 <div id="ascii-container" class="ascii-art"></div>

  <script>
    function colorAsciiArt(asciiText) {
      const colorMap = {
        '#': 'bela1',
        '.': 'krem',
        '*': 'narandzasta',
        '+': 'crvena',
        '=': 'narandzasta',
        ':': 'narandzasta',
        '-': 'purple',
        '@': 'crna',
        '%': 'plava3',
        
      };
  
      let coloredHtml = '';
      for (const char of asciiText) {
        if (colorMap[char]) {
          coloredHtml += `<span class="${colorMap[char]}">${char}</span>`;
        } else if (char === '\n') {
          coloredHtml += '<br>';
        } else {
          coloredHtml += char;
        }
      }
      return coloredHtml;
    }
