<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Color map ASCII art</title>
  <style>
    body {
      background-color: hsl(234, 54%, 37%);
      color: rgb(247, 240, 240);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      
      
      
      
    }
    
    .ascii-art {
      font-family: monospace;
      white-space: pre;
      line-height: 0.5;
      font-size:8px;
      

    }   

    .plava1{
      color: rgb(7, 84, 156);
       text-shadow: 0 0 5px rgb(177, 4, 4)
      0 0 10px rgba(141, 1, 1, 0.986);
      
    }
    .plava2{
      color: rgb(3, 13, 71);
     
      
      
    }
    .plava3{
      color: rgb(10, 151, 233);
      opacity: 0.4;
      
      
    }
    .crvena{
      color: rgb(245, 0, 0);
      text-shadow: 0 0 5px rgb(177, 4, 4)
      0 0 10px rgba(141, 1, 1, 0.986);
      opacity: 0.2;
  
     
      
    }
    .narandzasta{
      color: rgb(235, 178, 22);
     
      
      
    }.bela1{
      color: rgb(255, 255, 255);
      
    }  
    .zelena{
      color: rgb(29, 214, 12);
      opacity: 0.6;
   
    }  
    .krem{
      color: rgb(214, 193, 99);
      
    }
    .crna{
      color: black;
      text-shadow: 0 0 5px rgb(70, 4, 177)
      0 0 10px rgba(129, 1, 141, 0.986);
      opacity: 0.2;
     
      
    }
    .pink{
      color: rgb(252, 169, 241);
    }  
    .purple{
      color: blueviolet;
       text-shadow: 0 0 5px rgb(70, 4, 177)
      0 0 10px rgba(129, 1, 141, 0.986);
      opacity: 0.5;
    }
  
    @keyframes levitate {
  0%   { transform: translateY(0); }
  50%  { transform: translateY(-25px); }
  100% { transform: translateY(0); }
}

.levitate {
  animation: levitate 3s ease-in-out infinite;
}
  </style>
</head>
<body>
  
 <div id="ascii-container" class="ascii-art"></div>

<script>
  function colorAsciiArt(asciiText) {
    const colorMap = {
    '#': 'crvena',
        '.': 'purple',
        '*': 'plava1',
        '+': 'zelena',
        '=': 'plava1',
        ':': 'narandzasta',
        '-': 'zelena',
        '@': 'crna',
        '%': 'plava3',
        
    };

    let coloredHtml = '';
    for (const char of asciiText) {
      if (colorMap[char]) {
        coloredHtml += `<span class="${colorMap[char]}">${char}</span>`;
      } else if (char === '\n') {
        coloredHtml += '<br>';
      } else {
        coloredHtml += char;
      }
    }
    return coloredHtml;
  }

  const asciiContainer = document.getElementById('ascii-container');
  asciiContainer.classList.add('levitate');
